[project]
name = "spam-service"
version = "0.1.0"
description = "My first ML-service"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pandas",
    "scikit-learn==1.9.1",
    "joblib",
    "psycopg[binary]",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "locust",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "spam"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: тесты, которым нужен Postgres"]

[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
